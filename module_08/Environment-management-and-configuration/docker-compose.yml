# docker-compose.yml
# ================================
# Setup: cp .env.example .env
# Run:   docker-compose up --build
# Stop:  docker-compose down
# Exec:  docker-compose exec ollama ollama pull llama3.2:1b

# Compose v2+ ignores this and prints a warning, kept because the exercise asks for it
version: "3.8"

# same project name as the docker-compose.yml exercise, so this stack reuses its
# volumes and the model that's already pulled into ollama_models
name: rag-stack

services:

  # ── Backend service (FastAPI RAG API) ──────────────────────────────────
  backend:
    build: .

    # 127.0.0.1 publishes the port on the Mac's loopback only. Without it
    # Docker listens on every interface, so anyone on the same network could
    # reach the API (and get tracebacks with DEBUG=true). This is the Mac side
    # only, uvicorn inside the container still has to listen on 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"

    # every KEY=value line in .env becomes an env var in the container, which
    # config.py reads. Compose only reads the file when it creates the
    # container, so after editing .env run `docker-compose up -d` (recreates
    # it), a plain `docker-compose restart` keeps the old values
    env_file: .env

    # anything here wins over the same key from env_file. .env has the values
    # for running the app straight on the Mac (localhost, ./rag_db), these two
    # only make sense inside the compose setup so they're fixed here
    environment:
      # Compose puts both services on one network and registers each service
      # name in Docker's DNS, so "ollama" resolves to the ollama container.
      # localhost here would be the backend container itself
      - OLLAMA_URL=http://ollama:11434
      # has to match where the chroma_data volume is mounted below
      - CHROMA_PATH=/app/rag_db

    volumes:
      # chroma writes here, so ingested chunks outlive the container
      - chroma_data:/app/rag_db

    # a plain "- ollama" only waits for the container to start, not for Ollama
    # to be listening, so /health could say "disconnected" for the first few
    # seconds. service_healthy waits for the healthcheck below to pass first
    depends_on:
      ollama:
        condition: service_healthy

  # ── Ollama service (local LLM runtime) ────────────────────────────────
  ollama:
    image: ollama/ollama

    # same file as the backend, so .env is the one place to configure the whole
    # stack. Ollama ignores the app's settings (its own are OLLAMA_HOST,
    # OLLAMA_KEEP_ALIVE, ...), but any of those added to .env would reach it.
    # Like the backend, it's recreated by `docker-compose up -d` after .env changes
    env_file: .env

    # the backend talks to ollama over the internal network and doesn't need
    # this. It's here so ollama can also be reached from the Mac on :11434.
    # If Ollama is already running on the Mac, start with
    # OLLAMA_HOST_PORT=11435 docker-compose up -d instead of stopping it
    # loopback only as well, see the backend's ports
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"

    volumes:
      # pulled models live in /root/.ollama/models, ~1.3GB for llama3.2:1b
      - ollama_models:/root/.ollama

    # ollama list fails until the server is answering. Checks every second
    # while starting up, then every 30s once it's healthy
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

# ── Named volumes ──────────────────────────────────────────────────────────
# Docker manages these outside the containers. docker-compose down removes the
# containers and the network but leaves volumes alone, only down -v deletes them
volumes:
  chroma_data:
  ollama_models:
