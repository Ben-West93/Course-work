# .github/workflows/ci.yml
# =====================================
# GitHub Actions CI pipeline for the RAG project.
# Runs on every push and pull request to main.
#
# GitHub only reads workflows from .github/workflows/ at the root of a repo.
# This project lives in module_08/ of Course-work, so the copy that actually
# runs is /.github/workflows/rag-application-ci.yml: the same jobs with the
# paths pointed into module_08/RAG-Application-CI. Change both together.
#
# View results in: Repository → Actions tab → RAG Application CI

name: RAG Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the jobs only read the repo, so the token doesn't need to write anything
permissions:
  contents: read

# none of the jobs has a needs:, so all three start at the same time, each on
# its own fresh runner. A failure in one doesn't stop or skip the others
jobs:
  # ── Job 1: Run Python tests ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # the tests fake Ollama and take seconds. If something does hang on a
    # network call, this beats GitHub's 6 hour default
    timeout-minutes: 10
    defaults:
      run:
        # only applies to run: steps, so pip and pytest find requirements.txt,
        # pytest.ini and main.py
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # caches pip's downloads (chromadb pulls in onnxruntime and friends),
          # keyed on requirements.txt. uses: inputs ignore working-directory,
          # so this path is from the repo root
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # TestClient needs httpx. Neither is in requirements.txt since the
          # image doesn't need them
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Provide dummy env vars so config.py doesn't fail in CI. Nothing
          # listens on 11434 here, every Ollama call in the tests is faked
          OLLAMA_URL: http://localhost:11434
          CHROMA_PATH: ./test_chroma

  # ── Job 2: Verify Docker builds ──────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t rag-backend ./backend

      - name: Build frontend image
        run: docker build -t rag-frontend ./frontend

      - name: Verify images exist
        run: |
          docker images rag-backend && docker images rag-frontend
          # docker images exits 0 even when nothing matches, so on its own it
          # can't fail the step. inspect exits 1 if either image is missing
          docker image inspect rag-backend rag-frontend > /dev/null

  # ── Job 3: Lint ───────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check code formatting
        run: |
          # same version as the local venv. Newer releases change the default
          # rules, so an unpinned install could fail on code that passes locally.
          # Settings are in ruff.toml
          pip install ruff==0.16.10
          ruff check backend/ frontend/
