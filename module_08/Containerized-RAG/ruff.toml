# used by `ruff check backend/ frontend/`, locally and in the CI lint job
target-version = "py311"
# main.py and the tests import config, rag and main by bare name from backend/
src = ["backend", "frontend"]
# the course starters stay exactly as they were handed out
extend-exclude = ["*.starter.py"]

# src above is resolved from the current directory when --config is passed, so
# naming the backend modules keeps import sorting the same wherever ruff runs
[lint.isort]
known-first-party = ["config", "main", "rag"]
