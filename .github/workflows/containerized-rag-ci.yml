# CI for module_08/Containerized-RAG
#
# The project's own workflow is module_08/Containerized-RAG/.github/workflows/ci.yml,
# but GitHub only runs workflows from .github/workflows/ at the repo root. This
# is that file with every path pointed into the project folder, so change both
# together. The paths filter keeps pushes to other modules from running it.

name: Containerized RAG CI

on:
  push:
    branches: [main]
    paths:
      - "module_08/Containerized-RAG/**"
      - ".github/workflows/containerized-rag-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "module_08/Containerized-RAG/**"
      - ".github/workflows/containerized-rag-ci.yml"

permissions:
  contents: read

# project root for every run: step. The test job overrides it (a job-level
# default replaces this one rather than adding to it, hence the full path)
defaults:
  run:
    working-directory: module_08/Containerized-RAG

# no needs: between the jobs, so all three run in parallel
jobs:
  # ── Job 1: Run Python tests ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: module_08/Containerized-RAG/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # uses: inputs are relative to the repo root, not working-directory
          cache: pip
          cache-dependency-path: |
            module_08/Containerized-RAG/backend/requirements.txt
            module_08/Containerized-RAG/backend/requirements-dev.txt

      - name: Install dependencies
        # runtime packages plus pytest and httpx2, all pinned
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # the tests use a temp ChromaDB folder and a closed Ollama port, no services needed
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Job 2: Verify Docker builds ──────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # the Dockerfile's test stage runs the suite inside the same environment
      # the API ships in, network switched off. A failing test stops the job
      # here, before the runtime image is built
      - name: Run tests inside the backend image build
        run: docker build --target test ./backend

      - name: Build backend image
        run: docker build -t rag-backend ./backend

      - name: Build frontend image
        run: docker build -t rag-frontend ./frontend

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Verify images exist
        # docker images exits 0 even with no match, inspect fails if either is missing
        run: docker image inspect rag-backend rag-frontend > /dev/null

  # ── Job 3: Lint ───────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check code
        # same ruff as the local venv, newer releases change the default rules
        run: |
          pip install ruff==0.16.10
          ruff check backend/ frontend/
